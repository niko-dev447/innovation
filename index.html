<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Innovation | Timeline</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; scroll-behavior: smooth; }
        .glass-nav { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(226, 232, 240, 0.8); }
        .card-hover { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .card-hover:hover { transform: translateY(-6px); shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1); }
        .filter-active { background-color: #1e3a8a !important; color: white !important; box-shadow: 0 10px 15px -3px rgba(30, 58, 138, 0.3); }
        .gradient-bg { background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%); }
        .timeline-tag { font-size: 0.65rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; }
    </style>
</head>
<body class="bg-[#f8fafc] text-slate-900 min-h-screen">

    <nav class="sticky top-0 z-50 glass-nav py-4 px-6">
        <div class="max-w-7xl mx-auto flex flex-col lg:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 gradient-bg rounded-xl flex items-center justify-center text-white font-extrabold shadow-lg">NH</div>
                <div>
                    <h1 class="text-lg font-extrabold tracking-tight leading-none">Niko Hossain</h1>
                    <span class="text-[10px] text-blue-600 font-bold uppercase tracking-widest leading-none">Innovation Archive 2006-2026</span>
                </div>
            </div>
            <div class="relative w-full sm:w-80">
                <input type="text" id="searchInput" placeholder="Suche in 20 Jahren Innovation..." 
                    class="w-full pl-10 pr-4 py-2 bg-white border border-slate-200 rounded-full focus:ring-2 focus:ring-blue-500 focus:outline-none shadow-sm text-sm transition-all">
                <i data-lucide="search" class="absolute left-3.5 top-2.5 text-slate-400 w-4 h-4"></i>
            </div>
        </div>
    </nav>

    <header class="max-w-7xl mx-auto px-6 pt-16 pb-12">
        <div class="flex flex-col lg:flex-row lg:items-end justify-between gap-8 mb-12">
            <div class="max-w-2xl">
                <div class="inline-block px-3 py-1 bg-blue-50 text-blue-700 text-[10px] font-bold uppercase tracking-widest rounded-full mb-4">Master Documentation</div>
                <h2 class="text-5xl md:text-7xl font-black text-slate-900 tracking-tighter mb-6 italic uppercase">Vision to <span class="text-blue-600">Reality.</span></h2>
                <p class="text-lg text-slate-500 leading-relaxed font-medium">
Research, expert contributions, publications, start-up projects, policy work, open-source initiatives, and data platforms.
                </p>
            </div>
            <div class="flex flex-wrap gap-2" id="filterContainer">
                <button onclick="filterContent('all', this)" class="filter-btn filter-active px-5 py-2 rounded-full border border-slate-200 bg-white shadow-sm text-[11px] font-bold transition-all uppercase">Alle</button>
                <button onclick="filterContent('fraunhofer', this)" class="filter-btn px-5 py-2 rounded-full border border-slate-200 bg-white shadow-sm text-[11px] font-bold transition-all uppercase">Fraunhofer / EU</button>
                <button onclick="filterContent('lufthansa', this)" class="filter-btn px-5 py-2 rounded-full border border-slate-200 bg-white shadow-sm text-[11px] font-bold transition-all uppercase">Lufthansa Cargo</button>
                <button onclick="filterContent('lobster', this)" class="filter-btn px-5 py-2 rounded-full border border-slate-200 bg-white shadow-sm text-[11px] font-bold transition-all uppercase">Lobster / Cloud</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 pb-32">
        <div id="timelineGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Dynamically populated -->
        </div>
        <div id="noResults" class="hidden text-center py-32">
            <p class="text-slate-400 font-medium">Keine Einträge für diese Suche gefunden.</p>
        </div>
    </main>

    <footer class="bg-slate-900 text-white py-16 px-6">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-8">
            <div class="text-center md:text-left">
                <p class="text-2xl font-black italic uppercase mb-2">Niko Hossain</p>
                <p class="text-slate-500 text-sm">Digital, Sustainable Results.</p>
            </div>
            <div class="flex gap-4">
                <a href="https://pin.it/4Zs0yOd80" target="_blank" class="p-3 bg-slate-800 rounded-xl hover:bg-red-600 transition-colors">
                    <i data-lucide="camera" class="w-6 h-6"></i>
                </a>
                <a href="#" target="_blank" class="p-3 bg-slate-800 rounded-xl hover:bg-blue-600 transition-colors">
                    <i data-lucide="linkedin" class="w-6 h-6"></i>
                </a>
            </div>
        </div>
    </footer>

    <script>
        let timelineData = [];
        const TIMELINE_DATA_URL = './data/timelineData.json';

        async function loadTimelineData() {
            try {
                const res = await fetch(TIMELINE_DATA_URL, { cache: 'no-store' });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const json = await res.json();
                // normalize + sort desc by year
                timelineData = (Array.isArray(json) ? json : [])
                    .map(i => ({
                        ...i,
                        year: (i?.year ?? '').toString(),
                        tags: Array.isArray(i?.tags) ? i.tags : [],
                        source: i?.source ?? ''
                    }))
                    .sort((a,b) => (parseInt(b.year||'0',10) - parseInt(a.year||'0',10)));
            } catch (e) {
                console.error('Failed to load timeline JSON', e);
                timelineData = [];
            }
        }

        function sourcesToHtml(source) {
            // Supports: string | [{label,url}, ...]
            if (Array.isArray(source)) {
                const links = source
                    .filter(s => s && (s.url || s.label))
                    .map((s, idx) => {
                        const label = (s.label || 'Quelle').trim();
                        const url = s.url ? s.url.trim() : '';
                        if (url) {
                            return `<a href="${url}" target="_blank" rel="noopener noreferrer" class="hover:text-blue-600">${label}</a>`;
                        }
                        return `<span>${label}</span>`;
                    });
                return links.length ? links.join(' · ') : '<span>–</span>';
            }
            if (typeof source === 'string' && source.trim()) {
                const s = source.trim();
                if (/^https?:\/\//i.test(s)) {
                    return `<a href="${s}" target="_blank" rel="noopener noreferrer" class="hover:text-blue-600">Quelle</a>`;
                }
                return `<span>${s}</span>`;
            }
            return '<span>–</span>';
        }

function renderCards(data) {
            const grid = document.getElementById('timelineGrid');
            const noResults = document.getElementById('noResults');
            grid.innerHTML = '';
            
            if (data.length === 0) {
                noResults.classList.remove('hidden');
            } else {
                noResults.classList.add('hidden');
                data.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card-hover bg-white rounded-3xl border border-slate-100 p-8 flex flex-col h-full shadow-sm';
                    
                    let icon = 'layers';
                    if(item.cat === 'lufthansa') icon = 'plane';
                    if(item.cat === 'lobster') icon = 'cloud';
                    if(item.cat === 'fraunhofer') icon = 'microscope';

                    card.innerHTML = `
                        <div class="flex justify-between items-start mb-6">
                            <span class="text-blue-600 font-extrabold text-2xl tracking-tighter">${item.year}</span>
                            <div class="p-2 bg-slate-50 rounded-lg text-slate-300">
                                <i data-lucide="${icon}" class="w-5 h-5"></i>
                            </div>
                        </div>
                        <div class="flex-grow">
                            <span class="timeline-tag text-blue-500 mb-2 block">${item.medium}</span>
                            <h3 class="text-xl font-bold text-slate-900 leading-snug mb-2">${item.title}</h3>
                            <p class="text-slate-400 text-[11px] font-bold uppercase tracking-wider mb-4 flex items-center gap-1.5">
                                <i data-lucide="map-pin" class="w-3 h-3"></i> ${item.context}
                            </p>
                            <p class="text-slate-500 text-sm leading-relaxed mb-6 font-medium">${item.desc}</p>
                        </div>
                        <div class="mt-auto">
                            <div class="flex flex-wrap gap-1.5 mb-6">
                                ${(item.tags || []).map(t => `<span class="px-2 py-0.5 bg-slate-50 text-slate-400 text-[9px] font-bold rounded uppercase border border-slate-100">${t}</span>`).join('')}
                            </div>
                            <div class="pt-4 border-t border-slate-50 flex justify-between items-center text-[10px] font-bold text-slate-300 uppercase tracking-widest">
                                <span>Quelle: ${sourcesToHtml(item.source)}</span>
                                <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            }
            lucide.createIcons();
        }

        function filterContent(category, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('filter-active'));
            btn.classList.add('filter-active');
            renderCards(category === 'all' ? timelineData : timelineData.filter(i => i.cat === category));
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = timelineData.filter(i => 
                i.title.toLowerCase().includes(term) || 
                i.desc.toLowerCase().includes(term) || 
                i.year.toString().includes(term) ||
                i.tags.some(t => t.toLowerCase().includes(term))
            );
            renderCards(filtered);
        });

        window.onload = async () => {
            await loadTimelineData();
            renderCards(timelineData);
            lucide.createIcons();
        }
</script>
    <script src="https://unpkg.com/lucide@latest">
