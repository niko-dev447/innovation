<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Niko Hossain | Innovation & Logistics Timeline</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-nav { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(226, 232, 240, 0.8); }
        .card-hover { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .card-hover:hover { transform: translateY(-4px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); }
        .filter-active { background-color: #1e3a8a !important; color: white !important; }
        .gradient-bg { background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%); }
        /* Verhindert Layout-Sprünge beim Laden */
        [box-icon] { visibility: hidden; }
    </style>
</head>
<body class="bg-[#f8fafc] text-slate-900 min-h-screen">

    <!-- Navigation -->
    <nav class="sticky top-0 z-50 glass-nav py-4 px-6">
        <div class="max-w-7xl mx-auto flex flex-col lg:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 gradient-bg rounded-xl flex items-center justify-center text-white font-extrabold shadow-lg">NH</div>
                <div>
                    <h1 class="text-lg font-extrabold tracking-tight leading-none">Niko Hossain</h1>
                    <span class="text-[10px] text-blue-600 font-bold uppercase tracking-widest">Innovation Archive 2006-2026</span>
                </div>
            </div>
            
            <div class="flex flex-col sm:flex-row items-center gap-4 w-full lg:w-auto">
                <div class="relative w-full sm:w-80">
                    <input type="text" id="searchInput" placeholder="Suche nach Thema, Ort oder Jahr..." 
                        class="w-full pl-10 pr-4 py-2 bg-white border border-slate-200 rounded-full focus:ring-2 focus:ring-blue-500 focus:outline-none shadow-sm text-sm">
                    <i data-lucide="search" class="absolute left-3.5 top-2.5 text-slate-400 w-4 h-4"></i>
                </div>
            </div>
        </div>
    </nav>

    <!-- Header -->
    <header class="max-w-7xl mx-auto px-6 pt-16 pb-12">
        <div class="flex flex-col lg:flex-row lg:items-end justify-between gap-8 mb-12">
            <div class="max-w-2xl">
                <h2 class="text-4xl md:text-6xl font-black text-slate-900 tracking-tighter mb-6">Vision to <span class="text-blue-600">Reality.</span></h2>
                <p class="text-lg text-slate-500 leading-relaxed">
                    Vom "Internet der Dinge" in der Grundlagenforschung bis zur globalen KI-Steuerung. Eine Dokumentation meiner Publikationen und Meilensteine.
                </p>
            </div>
            <div class="flex flex-wrap gap-2" id="filterContainer">
                <button onclick="filterContent('all', this)" class="filter-btn filter-active px-5 py-2 rounded-full border border-slate-200 bg-white shadow-sm text-xs font-bold transition-all uppercase">Alle</button>
                <button onclick="filterContent('fraunhofer', this)" class="filter-btn px-5 py-2 rounded-full border border-slate-200 bg-white shadow-sm text-xs font-bold transition-all uppercase">Fraunhofer / EU</button>
                <button onclick="filterContent('lufthansa', this)" class="filter-btn px-5 py-2 rounded-full border border-slate-200 bg-white shadow-sm text-xs font-bold transition-all uppercase">Lufthansa Cargo</button>
                <button onclick="filterContent('lobster', this)" class="filter-btn px-5 py-2 rounded-full border border-slate-200 bg-white shadow-sm text-xs font-bold transition-all uppercase">Lobster / Cloud</button>
            </div>
        </div>
    </header>

    <!-- Grid -->
    <main class="max-w-7xl mx-auto px-6 pb-32">
        <div id="timelineGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Dynamisch gefüllt -->
        </div>
        <div id="noResults" class="hidden text-center py-32">
            <p class="text-slate-400 font-medium">Keine Ergebnisse gefunden.</p>
        </div>
    </main>

    <script>
        const timelineData = [
            { year: 2024, title: "Logistics Summit Pitch", context: "Düsseldorf", cat: "lobster", desc: "Jury und Pitching moderner SaaS-Plattformen.", tags: ["#SaaS", "#Innovation"] },
            { year: 2021, title: "Visibility Automatisierung", context: "IT-ZOOM", cat: "lobster", desc: "Fachbeitrag über Echtzeit-Transparenz.", tags: ["#Visibility"] },
            { year: 2017, title: "Logistics Data Cloud", context: "Lufthansa Cargo", cat: "lufthansa", desc: "Leitung des neutralen Daten-Ökosystems.", tags: ["#Cloud", "#Ecosystem"] },
            { year: 2015, title: "Industrie 4.0 im Air Cargo", context: "DHL Forum", cat: "lufthansa", desc: "Cyber-Physical Systems in der operativen Luftfracht.", tags: ["#Industry40"] },
            { year: 2012, title: "Global IoT Keynote", context: "Wuxi, China", cat: "fraunhofer", desc: "IoT Wettbewerbsfähigkeit weltweit.", tags: ["#China", "#Global"] },
            { year: 2010, title: "Perspectives on the IoT", context: "Tokio, Japan", cat: "fraunhofer", desc: "Globale Standards im Internet der Dinge.", tags: ["#Tokyo", "#IoT"] },
            { year: 2010, title: "Autonomes Container-Netz", context: "BMWi Berlin", cat: "lufthansa", desc: "Projekt Dyconet: Dezentrale Steuerung.", tags: ["#Autonomy", "#KI"] },
            { year: 2009, title: "EU IoT Strategic Roadmap", context: "Brüssel", cat: "fraunhofer", desc: "Strategiepapier für die EU-Kommission.", tags: ["#EU", "#Policy"] },
            { year: 2007, title: "Handbuch Industrie 4.0", context: "Springer-Verlag", cat: "fraunhofer", desc: "Fachbuchbeitrag zur Faszination RFID.", tags: ["#Standard", "#IoT"] },
            { year: 2006, title: "IoT Erfolgsstrategien KMU", context: "Karlsruhe", cat: "fraunhofer", desc: "Digitalisierung für den Mittelstand.", tags: ["#KMU", "#Beginnings"] }
        ];

        function renderCards(data) {
            const grid = document.getElementById('timelineGrid');
            grid.innerHTML = '';
            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card-hover bg-white rounded-3xl border border-slate-100 p-8 flex flex-col h-full';
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-6">
                        <span class="text-blue-600 font-extrabold text-2xl tracking-tighter">${item.year}</span>
                        <div class="p-2 bg-slate-50 rounded-lg text-slate-300">
                            <i data-lucide="${item.cat === 'lufthansa' ? 'plane' : (item.cat === 'lobster' ? 'cloud' : 'layers')}" class="w-5 h-5"></i>
                        </div>
                    </div>
                    <div class="flex-grow">
                        <h3 class="text-xl font-bold text-slate-900 leading-snug mb-2">${item.title}</h3>
                        <p class="text-slate-400 text-xs font-bold uppercase tracking-wider mb-4">${item.context}</p>
                        <p class="text-slate-500 text-sm leading-relaxed mb-6">${item.desc}</p>
                    </div>
                    <div class="flex flex-wrap gap-1.5 mt-auto">
                        ${item.tags.map(t => `<span class="px-2 py-0.5 bg-slate-50 text-slate-400 text-[9px] font-bold rounded uppercase">${t}</span>`).join('')}
                    </div>
                `;
                grid.appendChild(card);
            });
            lucide.createIcons();
        }

        function filterContent(category, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('filter-active'));
            btn.classList.add('filter-active');
            renderCards(category === 'all' ? timelineData : timelineData.filter(i => i.cat === category));
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            renderCards(timelineData.filter(i => i.title.toLowerCase().includes(term) || i.desc.toLowerCase().includes(term) || i.year.toString().includes(term)));
        });

        window.onload = () => renderCards(timelineData);
    </script>
</body>
</html>
